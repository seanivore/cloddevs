<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CLAUD Protocol Landing Experience</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app-container">
    <canvas id="sceneCanvas"></canvas>
    <div id="uiLayer">
      <div class="popup" id="genericBuildingPopup">
        <h2 id="popupTitle">Building Title</h2>
        <p id="popupBody">Building text goes here...</p>
        <button class="close-btn" onclick="hidePopup('genericBuildingPopup')">Close</button>
      </div>
      <div class="popup" id="towerInfo">
        <h2>Radio Tower Active</h2>
        <p>Listening to the "Deep Dive" podcast audio. Feel free to integrate sub-titles or transcripts here!</p>
        <button class="close-btn" onclick="hidePopup('towerInfo')">Close</button>
      </div>
      <div class="radio-toggle" id="radioToggle">Toggle Radio</div>
    </div>
  </div>
  <audio id="radioAudio" src="./assets/audio/deep_dive_podcast.mp3" preload="auto"></audio>
  <script src="https://cdn.jsdelivr.net/npm/three@0.153.0/build/three.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
